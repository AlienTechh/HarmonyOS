<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zon OS Simulator</title>
    <style>
        :root {
            --system-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: var(--system-font);
            background: #1c1c1e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Compact Phone Frame */
        .phone-frame {
            width: 360px;
            height: 700px;
            background: #000;
            border-radius: 46px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 10px #2c2c2e, inset 0 0 0 12px #1c1c1e;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Hardware Buttons on the Frame */
        .button-power {
            position: absolute;
            right: -12px;
            top: 150px;
            width: 4px;
            height: 60px;
            background: #2c2c2e;
            border-radius: 0 3px 3px 0;
        }

        .button-volume-up {
            position: absolute;
            left: -12px;
            top: 120px;
            width: 4px;
            height: 45px;
            background: #2c2c2e;
            border-radius: 3px 0 0 3px;
        }

        .button-volume-down {
            position: absolute;
            left: -12px;
            top: 175px;
            width: 4px;
            height: 45px;
            background: #2c2c2e;
            border-radius: 3px 0 0 3px;
        }

        /* Screen Inner Wallpaper Container */
        .screen-content {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            margin: 10px;
            border-radius: 36px;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.3px;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 11px;
        }

        /* Home Screen App Grid */
        .home-screen {
            flex: 1;
            padding: 10px 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 75px;
            gap: 12px;
            justify-items: center;
            align-content: start;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .app-icon:active {
            transform: scale(0.9);
            opacity: 0.8;
        }

        .icon-graphic {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 4px;
        }

        .app-name {
            font-size: 10px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            font-weight: 400;
            text-align: center;
        }

        /* Zon OS App Theme Styles */
        #safari .icon-graphic { background: linear-gradient(135deg, #1e88e5, #0d47a1); }
        #photos .icon-graphic { background: linear-gradient(135deg, #ffffff, #e0e0e0); color: #333; }
        #messages .icon-graphic { background: linear-gradient(135deg, #34c759, #248a3d); }
        #settings .icon-graphic { background: linear-gradient(135deg, #8e8e93, #636366); }
        #music .icon-graphic { background: linear-gradient(135deg, #ff2d55, #af002a); }
        #notes .icon-graphic { background: linear-gradient(135deg, #ffcc00, #ff9500); }

        /* Dock */
        .dock-container {
            padding: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
        }

        .dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 6px 10px;
            display: flex;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 0.5px solid rgba(255, 255, 255, 0.3);
        }

        .dock .icon-graphic {
            width: 46px;
            height: 46px;
            margin-bottom: 0;
        }

        .dock .app-name {
            display: none;
        }

        /* Opened App Window with Zoom Animation from Icon Origin */
        .app-window {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            color: #000000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            border-radius: 36px;
            overflow: hidden;
            
            /* Zoom Animation Properties */
            transform-origin: var(--origin-x, 50%) var(--origin-y, 50%);
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .app-window.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .app-header {
            height: 45px;
            background: #f7f7f7;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 18px;
            font-weight: 600;
            padding-top: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .app-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f2f2f7;
        }

        /* Home Indicator Line Bar in the Middle Bottom */
        .home-indicator-container {
            position: absolute;
            bottom: 6px;
            left: 0;
            width: 100%;
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110; /* Sits above standard app window content */
            cursor: grab;
        }

        .home-indicator {
            width: 110px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            transition: background 0.2s;
        }
        
        .home-indicator-container:active .home-indicator {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Compact Phone Hardware Frame Wrapper -->
    <div class="phone-frame">
        <!-- Hardware Buttons -->
        <div class="button-power"></div>
        <div class="button-volume-up"></div>
        <div class="button-volume-down"></div>

        <!-- Inner Screen Container -->
        <div class="screen-content" id="screenContainer">
            <!-- Top Status Bar -->
            <div class="status-bar">
                <span id="clock">9:41</span>
                <div class="status-icons">
                    <span>5G</span>
                    <span>🔋</span>
                </div>
            </div>

            <!-- Home Screen Grid -->
            <div class="home-screen">
                <div class="app-icon" onclick="openApp(event, 'Messages', '💬')">
                    <div class="icon-graphic">💬</div>
                    <span class="app-name">Messages</span>
                </div>
                <div class="app-icon" onclick="openApp(event, 'Photos', '🖼️')">
                    <div class="icon-graphic">🖼️</div>
                    <span class="app-name">Photos</span>
                </div>
                <div class="app-icon" onclick="openApp(event, 'Camera', '📷')">
                    <div class="icon-graphic" style="background: linear-gradient(135deg, #3a3a3c, #1c1c1e);">📷</div>
                    <span class="app-name">Camera</span>
                </div>
                <div class="app-icon" onclick="openApp(event, 'Notes', '📝')">
                    <div class="icon-graphic" id="notes">📝</div>
                    <span class="app-name">Notes</span>
                </div>
                <div class="app-icon" onclick="openApp(event, 'Music', '🎵')">
                    <div class="icon-graphic" id="music">🎵</div>
                    <span class="app-name">Zon Music</span>
                </div>
                <div class="app-icon" onclick="openApp(event, 'Settings', '⚙️')">
                    <div class="icon-graphic" id="settings">⚙️</div>
                    <span class="app-name">Zon Settings</span>
                </div>
            </div>

            <!-- Dock Area -->
            <div class="dock-container">
                <div class="dock">
                    <div class="app-icon" onclick="openApp(event, 'Safari', '🧭')">
                        <div class="icon-graphic" id="safari">🧭</div>
                    </div>
                    <div class="app-icon" onclick="openApp(event, 'Phone', '📞')">
                        <div class="icon-graphic" style="background: linear-gradient(135deg, #34c759, #248a3d);">📞</div>
                    </div>
                    <div class="app-icon" onclick="openApp(event, 'Mail', '✉️')">
                        <div class="icon-graphic" style="background: linear-gradient(135deg, #007aff, #0056b3);">✉️</div>
                    </div>
                    <div class="app-icon" onclick="openApp(event, 'Zon Store', '🛒')">
                        <div class="icon-graphic" style="background: linear-gradient(135deg, #ff9500, #ffcc00);">🛒</div>
                    </div>
                </div>
            </div>

            <!-- Dynamic App Window -->
            <div class="app-window" id="appWindow">
                <div class="app-header">
                    <span id="appNameTitle">App</span>
                    <button class="close-btn" onclick="closeApp()">Done</button>
                </div>
                <div class="app-content" id="appBodyContent">
                    <!-- Dynamic content loaded via JS -->
                </div>
            </div>

            <!-- Bottom Line Indicator Bar with Slide-to-Close Touch/Mouse Support -->
            <div class="home-indicator-container" id="homeIndicatorBar">
                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <script>
        // Update live clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Open App with dynamic coordinate zoom origin
        function openApp(event, appName, emoji) {
            const windowEl = document.getElementById('appWindow');
            const titleEl = document.getElementById('appNameTitle');
            const contentEl = document.getElementById('appBodyContent');
            const screenContainer = document.getElementById('screenContainer');

            // Calculate exact center of clicked app icon relative to screen frame container
            const iconRect = event.currentTarget.getBoundingClientRect();
            const screenRect = screenContainer.getBoundingClientRect();
            
            const originX = (iconRect.left + iconRect.width / 2) - screenRect.left;
            const originY = (iconRect.top + iconRect.height / 2) - screenRect.top;

            // Apply scaling origin variables dynamically
            windowEl.style.setProperty('--origin-x', `${originX}px`);
            windowEl.style.setProperty('--origin-y', `${originY}px`);

            titleEl.innerText = appName;
            contentEl.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding-bottom: 30px;">
                    <div style="font-size: 48px; margin-bottom: 12px;">${emoji}</div>
                    <h2 style="font-size: 20px; margin-bottom: 6px; color: #111;">${appName}</h2>
                    <p style="color: #666; font-size: 13px; max-width: 220px;">Welcome to ${appName} running inside Zon OS.</p>
                </div>
            `;
            windowEl.classList.add('open');
        }

        // Close App Animation
        function closeApp() {
            const windowEl = document.getElementById('appWindow');
            windowEl.classList.remove('open');
        }

        // Slide-up gesture tracking specifically on the bottom indicator line bar
        const indicatorBar = document.getElementById('homeIndicatorBar');
        let startY = 0;

        indicatorBar.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        indicatorBar.addEventListener('touchmove', (e) => {
            let currentY = e.touches[0].clientY;
            if (startY - currentY > 30) { // If swiped up by more than 30px
                closeApp();
            }
        });

        // Mouse support for desktop testing
        indicatorBar.addEventListener('mousedown', (e) => {
            startY = e.clientY;
            
            function onMouseMove(moveEvent) {
                if (startY - moveEvent.clientY > 30) {
                    closeApp();
                    cleanup();
                }
            }

            function cleanup() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', cleanup);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', cleanup);
        });
    </script>
</body>
</html>
