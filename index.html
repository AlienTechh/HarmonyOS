<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZonOS Emulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none; /* Disable text highlight */
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Disable website scroll */
            touch-action: none; /* Prevent pinch-to-zoom and unwanted gestures */
        }

        /* Phone Frame */
        .phone-frame {
            width: 320px;
            height: 640px;
            background-color: #000;
            border-radius: 40px;
            border: 12px solid #333;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Speaker / Notch */
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 20px;
            background-color: #333;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 100;
        }

        /* Screen Area */
        .phone-screen {
            flex: 1;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* Home Screen */
        .home-screen {
            flex: 1;
            padding: 40px 20px 20px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 70px;
            gap: 15px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .app-icon:active {
            transform: scale(0.90);
        }

        .app-icon-img {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .app-icon span {
            font-size: 11px;
            margin-top: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Settings App - Smooth spring/bounce opening animation */
        .settings-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: scale(0.85) translateY(40px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .settings-app.open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .settings-header {
            padding: 45px 20px 15px 20px;
            font-size: 22px;
            font-weight: 700;
            border-bottom: 1px solid #222;
        }

        .settings-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .settings-item {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        /* Gesture Bar */
        .gesture-bar-container {
            height: 24px;
            width: 100%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 101;
            cursor: pointer;
        }

        .gesture-line {
            width: 100px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .gesture-bar-container:active .gesture-line {
            background-color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen" id="phoneScreen">
            
            <!-- Home Screen Layout -->
            <div class="home-screen">
                <div class="app-icon" id="openSettings">
                    <div class="app-icon-img">⚙️</div>
                    <span>Settings</span>
                </div>
            </div>

            <!-- Settings Application -->
            <div class="settings-app" id="settingsApp">
                <div class="settings-header">Settings</div>
                <div class="settings-content">
                    <div class="settings-item">
                        <span>ZonOS Version</span>
                        <span style="color: #888;">1.1.0</span>
                    </div>
                    <div class="settings-item">
                        <span>Fluid Animations</span>
                        <span style="color: #ff758c;">Active</span>
                    </div>
                    <div class="settings-item">
                        <span>Storage</span>
                        <span style="color: #888;">14.2GB / 64GB</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Swipe Line -->
            <div class="gesture-bar-container" id="gestureBar">
                <div class="gesture-line"></div>
            </div>

        </div>
    </div>

    <script>
        const openSettingsBtn = document.getElementById('openSettings');
        const settingsApp = document.getElementById('settingsApp');
        const gestureBar = document.getElementById('gestureBar');

        // Open Settings App with custom scale-up effect
        openSettingsBtn.addEventListener('click', () => {
            settingsApp.classList.add('open');
        });

        // Swipe up logic for touch screens
        let startY = 0;

        gestureBar.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        gestureBar.addEventListener('touchend', (e) => {
            let endY = e.changedTouches[0].clientY;
            if (startY - endY > 25) { // Threshold for swipe up
                settingsApp.classList.remove('open');
            }
        }, { passive: true });

        // Mouse support for desktop testing (Click & Drag up)
        gestureBar.addEventListener('mousedown', (e) => {
            startY = e.clientY;

            const onMouseUp = (upEvent) => {
                let endY = upEvent.clientY;
                if (startY - endY > 20) {
                    settingsApp.classList.remove('open');
                }
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mouseup', onMouseUp);
        });
    </script>
</body>
</html>
