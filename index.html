<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZonOS Emulator</title>
  <style>
    /* Global Anti-Scroll, Anti-Highlight, Anti-Zoom CSS */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Phone Outer Frame */
    .phone-frame {
      width: 320px;
      height: 640px;
      background: #000;
      border-radius: 40px;
      border: 12px solid #333;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Screen Area */
    .screen {
      flex: 1;
      background: linear-gradient(135deg, #2b5876, #4e4376);
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    /* Home Screen Grid */
    .home-screen {
      padding: 30px 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      transform-origin: center center;
      transition: transform 0.1s ease-out, opacity 0.1s ease-out;
    }

    /* Quick background scale from center */
    .home-screen.scaled {
      transform: scale(0.95);
      opacity: 0.7;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .app-icon:active {
      transform: scale(0.92);
    }

    .icon-box {
      width: 54px;
      height: 54px;
      background: #6c757d;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .app-name {
      margin-top: 6px;
      font-size: 11px;
    }

    /* Instant App Window Opening from Middle */
    .app-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      opacity: 0;
      transform: scale(0.96);
      transform-origin: center center; /* Centered transform */
      pointer-events: none;
      /* Extremely quick opening transition (0.1s) */
      transition: transform 0.1s ease-out, opacity 0.1s ease-out;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .app-window.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .app-header {
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }

    .app-content {
      padding: 20px;
      font-size: 14px;
      color: #aaa;
    }

    /* Bottom Home Indicator Bar */
    .home-bar-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }

    .home-bar {
      width: 120px;
      height: 5px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="screen" id="screen">

      <!-- Home Screen -->
      <div class="home-screen" id="homeScreen">
        <div class="app-icon" id="settingsApp">
          <div class="icon-box" style="background: #4a4e69;">⚙️</div>
          <span class="app-name">Settings</span>
        </div>
      </div>

      <!-- Settings Window -->
      <div class="app-window" id="settingsWindow">
        <div class="app-header">Settings</div>
        <div class="app-content">
          <p>Welcome to ZonOS v1.0</p>
        </div>
      </div>

      <!-- Swipe Bar -->
      <div class="home-bar-container" id="homeBar">
        <div class="home-bar"></div>
      </div>

    </div>
  </div>

  <script>
    const settingsApp = document.getElementById('settingsApp');
    const settingsWindow = document.getElementById('settingsWindow');
    const homeScreen = document.getElementById('homeScreen');
    const homeBar = document.getElementById('homeBar');

    // Prevent default screen scrolling
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    // Fast Open Settings App
    settingsApp.addEventListener('click', () => {
      settingsWindow.classList.add('active');
      homeScreen.classList.add('scaled');
    });

    // Close Settings App
    function closeApp() {
      settingsWindow.classList.remove('active');
      homeScreen.classList.remove('scaled');
    }

    // Swipe Up Detection on Bottom Home Line
    let startY = 0;

    homeBar.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    }, { passive: true });

    homeBar.addEventListener('touchend', (e) => {
      let endY = e.changedTouches[0].clientY;
      if (startY - endY > 20) {
        closeApp();
      }
    });

    // Mouse drag support for desktop testing
    let isDragging = false;

    homeBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging) {
        let endY = e.clientY;
        if (startY - endY > 20) {
          closeApp();
        }
        isDragging = false;
      }
    });
  </script>
</body>
</html>
