<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZonOS Emulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #09090b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* Phone Frame */
        .phone-frame {
            width: 320px;
            height: 640px;
            background-color: #111;
            border-radius: 44px;
            border: 10px solid #222;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.85), inset 0 0 12px rgba(255,255,255,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Dynamic Notch */
        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 24px;
            background-color: #000;
            border-radius: 12px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .phone-notch::before {
            content: '';
            position: absolute;
            left: 10px;
            width: 10px;
            height: 10px;
            background-color: #111;
            border-radius: 50%;
        }

        /* Screen Area with iOS Style Fluid Wallpaper */
        .phone-screen {
            flex: 1;
            background: 
                radial-gradient(circle at 0% 0%, #ff5277, transparent 50%),
                radial-gradient(circle at 100% 0%, #4a00e0, transparent 50%),
                radial-gradient(circle at 100% 100%, #00d2ff, transparent 50%),
                radial-gradient(circle at 0% 100%, #ff8c00, transparent 50%),
                #1a0b2e;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* Home Screen */
        .home-screen {
            flex: 1;
            padding: 50px 20px 20px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 70px;
            gap: 15px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s ease;
            outline: none;
        }

        .app-icon:active {
            opacity: 0.5;
        }

        .app-icon-img {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #a1a1aa, #52525b);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .app-icon span {
            font-size: 11px;
            margin-top: 6px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            letter-spacing: 0.2px;
        }

        /* Settings App - Smooth Origin Zoom (No Bounce) */
        .settings-app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f2f2f7;
            color: #000;
            z-index: 50;
            display: flex;
            flex-direction: column;
            
            /* Transform Origin precisely at the center of the first icon */
            /* Padding Left: 20px + Half Icon (28px) = 48px */
            /* Padding Top: 50px + Half Icon (28px) = 78px */
            transform-origin: 48px 78px;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
            
            /* Clean ease-out curve without bounce */
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.25s ease;
        }

        .settings-app.open {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .settings-header {
            padding: 55px 20px 15px 20px;
            font-size: 28px;
            font-weight: 700;
            border-bottom: 1px solid #d1d1d6;
            background-color: #f2f2f7;
        }

        .settings-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .settings-item {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Gesture Bar */
        .gesture-bar-container {
            height: 28px;
            width: 100%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 101;
            cursor: pointer;
        }

        /* Dynamic Gesture Bar Color */
        .gesture-line {
            width: 130px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            transition: background-color 0.25s ease, width 0.2s ease;
        }

        .settings-app.open ~ .gesture-bar-container .gesture-line {
            background-color: #000; /* Dark line when app is open */
        }

        .gesture-bar-container:active .gesture-line {
            width: 110px;
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen" id="phoneScreen">
            
            <!-- Home Screen Layout -->
            <div class="home-screen">
                <div class="app-icon" id="openSettings" tabindex="0">
                    <div class="app-icon-img">⚙️</div>
                    <span>Settings</span>
                </div>
            </div>

            <!-- Settings Application -->
            <div class="settings-app" id="settingsApp">
                <div class="settings-header">Settings</div>
                <div class="settings-content">
                    <div class="settings-item">
                        <span>ZonOS Version</span>
                        <span style="color: #007aff;">3.0</span>
                    </div>
                    <div class="settings-item">
                        <span>Animation</span>
                        <span style="color: #8e8e93;">Linear Seamless</span>
                    </div>
                    <div class="settings-item">
                        <span>Wallpaper</span>
                        <span style="color: #8e8e93;">iOS Fluid</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Swipe Line -->
            <div class="gesture-bar-container" id="gestureBar">
                <div class="gesture-line"></div>
            </div>

        </div>
    </div>

    <script>
        const openSettingsBtn = document.getElementById('openSettings');
        const settingsApp = document.getElementById('settingsApp');
        const gestureBar = document.getElementById('gestureBar');

        // Open Settings App directly from origin without bounce
        openSettingsBtn.addEventListener('click', () => {
            settingsApp.classList.add('open');
        });

        // Swipe up logic for touch screens
        let startY = 0;

        gestureBar.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        gestureBar.addEventListener('touchend', (e) => {
            let endY = e.changedTouches[0].clientY;
            if (startY - endY > 25) { // Swipe up threshold
                settingsApp.classList.remove('open');
            }
        }, { passive: true });

        // Mouse support for desktop testing (Click & Drag up)
        gestureBar.addEventListener('mousedown', (e) => {
            startY = e.clientY;

            const onMouseUp = (upEvent) => {
                let endY = upEvent.clientY;
                if (startY - endY > 20) {
                    settingsApp.classList.remove('open');
                }
                window.removeEventListener('mouseup', onMouseUp);
            };

            window.addEventListener('mouseup', onMouseUp);
        });
    </script>
</body>
</html>
