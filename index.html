<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>HarmonyOS Fluid Emulator</title>
    <style>
        :root {
            --hw-blue: #007dff;
            --hw-panel-light: #f1f3f5;
            --hw-text-dark: #1a1a1a;
            --hw-text-muted: #8a8a8f;
            --hw-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            --smooth-desktop: transform 1.2s cubic-bezier(0.15, 1, 0.2, 1), opacity 1s cubic-bezier(0.15, 1, 0.2, 1), filter 0.8s cubic-bezier(0.15, 1, 0.2, 1);
        }

        html, body {
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--hw-font);
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        .phone-frame {
            width: 300px;
            height: 610px;
            background-color: #0d0d0d;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 
                        inset 0 0 2px 1.5px rgba(255, 255, 255, 0.15);
            position: relative;
            border: 2.5px solid #2a2a2a;
        }

        .screen {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            background-color: #050508;
            perspective: 800px;
        }

        /* --- SINGLE DOT PUNCH HOLE --- */
        .punch-hole-dot {
            position: absolute;
            top: 7px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background-color: #000000;
            border-radius: 50%;
            z-index: 100;
            box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.2),
                        0 0 2px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .punch-hole-dot::after {
            content: '';
            width: 4px;
            height: 4px;
            background-color: #0b101d;
            border-radius: 50%;
            box-shadow: inset 0 0 1.5px rgba(255, 255, 255, 0.3);
        }

        /* --- ALWAYS VISIBLE GLOBAL STATUS BAR --- */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 28px;
            padding: 4px 14px 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: -0.1px;
            width: 100%;
            z-index: 50;
            transition: color 0.3s ease;
        }

        .status-left { 
            display: flex; 
            align-items: center; 
        }

        .clock-badge {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 1.5px 8px;
            border-radius: 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .clock-badge::before {
            content: '';
            width: 4px;
            height: 4px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 5px #30d158;
        }

        .status-icons { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            color: #ffffff;
            transition: color 0.3s ease;
        }

        .status-svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .icon-tag {
            font-size: 8px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.18);
            padding: 1px 3px;
            border-radius: 3px;
            color: currentColor;
            transition: background 0.3s ease;
        }

        .battery-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 255, 255, 0.15);
            padding: 1.5px 5px;
            border-radius: 8px;
            border: 0.5px solid rgba(255, 255, 255, 0.18);
            font-size: 9px;
            font-weight: 700;
            color: currentColor;
            transition: all 0.3s ease;
        }

        .screen.app-active .status-bar .status-icons { color: #1a1a1a; }
        .screen.app-active .status-bar .clock-badge {
            background: rgba(255, 255, 255, 0.65);
            border: 0.5px solid rgba(0, 0, 0, 0.1);
            color: #1a1a1a;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .screen.app-active .status-bar .icon-tag { background: rgba(0, 0, 0, 0.08); }
        .screen.app-active .status-bar .battery-pill {
            background: rgba(0, 0, 0, 0.06);
            border: 0.5px solid rgba(0, 0, 0, 0.12);
        }

        .wallpaper-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.huaweicentral.com/wp-content/uploads/2021/06/Huawei-HarmonyOS-wallpaper-1.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            transform: scale(1);
            filter: blur(0px);
            transition: var(--smooth-desktop);
        }

        .desktop {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 28px;
            padding-bottom: 40px; 
            transform: scale(1);
            opacity: 1;
            transition: var(--smooth-desktop);
        }

        .scrollable-apps-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .home-screen {
            padding: 16px 14px 4px 14px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 22px 10px;
            align-content: start;
        }

        .app-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .app-icon-wrapper:active { transform: scale(0.88); }

        /* --- PREMIER HIGH-QUALITY SQUIRCLE APP ICONS --- */
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 12.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.35),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .app-icon svg {
            width: 25px;
            height: 25px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
        }

        /* CUSTOM ICON GRADIENTS & STYLES */
        .icon-settings { background: linear-gradient(135deg, #e0e4e8 0%, #a2a8b0 100%); }
        .icon-gallery { background: linear-gradient(135deg, #2880eb 0%, #0051ba 100%); }
        .icon-music { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }
        .icon-market { background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%); }
        .icon-browser { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .icon-phone { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .icon-messages { background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%); }
        .icon-camera { background: linear-gradient(135deg, #495057 0%, #212529 100%); }
        .icon-files { background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); }

        .app-label {
            font-size: 10px;
            margin-top: 5px;
            text-align: center;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            max-width: 56px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.1px;
        }

        .app-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--hw-panel-light);
            border-radius: 32px;
            z-index: 20;
            color: var(--hw-text-dark);
            padding-top: 36px;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            opacity: 0; 
            transform: scale(0.01);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .app-panel.open {
            pointer-events: auto;
        }

        .app-header, .app-content {
            transition: opacity 0.15s ease-out;
            opacity: 1;
        }

        .app-panel.hidden-content .app-header,
        .app-panel.hidden-content .app-content {
            opacity: 0 !important;
        }

        /* BACKGROUND BLUR WHEN APP IS ACTIVE */
        .screen.app-active .wallpaper-container { 
            transform: scale(1.1); 
            filter: blur(12px);
        }
        
        .screen.app-active .desktop { 
            transform: scale(0.95); 
            opacity: 0; 
            pointer-events: none; 
        }

        .app-header {
            padding: 10px 18px 14px 18px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .app-content { flex: 1; overflow-y: auto; padding: 0 10px; }
        .content-group { background-color: #ffffff; border-radius: 12px; margin-bottom: 10px; overflow: hidden; border: 1px solid rgba(0, 0, 0, 0.02); }
        .content-item { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f2f2f5; font-size: 12.5px; font-weight: 500; }
        .content-item:last-child { border-bottom: none; }
        .content-value { color: var(--hw-text-muted); font-size: 11px; }

        .navigation-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 60;
            touch-action: none;
            cursor: pointer;
        }

        .gesture-line {
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background-color: rgba(255, 255, 255, 0.6);
            transition: background-color 0.3s;
            pointer-events: none;
        }

        .screen.app-active ~ .navigation-bar .gesture-line { background-color: rgba(0, 0, 0, 0.35); }
    </style>
</head>
<body>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const phoneScreen = document.getElementById('phoneScreen');
        const globalAppPanel = document.getElementById('globalAppPanel');
        const globalAppTitle = document.getElementById('globalAppTitle');
        const globalAppContent = document.getElementById('globalAppContent');
        const navBar = document.getElementById('navBar');
        
        let lastOpenedIconElement = null;
        let isAppWindowTargetOpen = false;

        const appDatabaseContent = {
            "Settings": `<div class="content-group"><div class="content-item"><span>Wi-Fi Network</span><span class="content-value">Connected &gt;</span></div><div class="content-item"><span>Bluetooth Mode</span><span class="content-value">Searching &gt;</span></div></div><div class="content-group"><div class="content-item"><span>System Version</span><span class="content-value">HarmonyOS Next v5.0</span></div></div>`,
            "Gallery": `<div class="content-group"><div class="content-item"><span>Camera Roll</span><span class="content-value">1,248 Items &gt;</span></div><div class="content-item"><span>Cloud Albums</span><span class="content-value">Synced Today &gt;</span></div></div>`,
            "Music": `<div class="content-group"><div class="content-item"><span>Current Track</span><span class="content-value">Now Playing Beats &gt;</span></div><div class="content-item"><span>Audio Stream Quality</span><span class="content-value">Lossless High-Fi &gt;</span></div></div>`,
            "Market": `<div class="content-group"><div class="content-item"><span>Updates Available</span><span class="content-value">3 Pending &gt;</span></div><div class="content-item"><span>Secured Verification</span><span class="content-value">Protected &gt;</span></div></div>`,
            "Browser": `<div class="content-group"><div class="content-item"><span>Homepage URL</span><span class="content-value">Huawei Core Live &gt;</span></div><div class="content-item"><span>Privacy Sandboxing</span><span class="content-value">Enabled &gt;</span></div></div>`,
            "Phone": `<div class="content-group"><div class="content-item"><span>Recent Calls</span><span class="content-value">Empty Log &gt;</span></div><div class="content-item"><span>Voicemail Inbox</span><span class="content-value">0 New Messages &gt;</span></div></div>`,
            "Messages": `<div class="content-group"><div class="content-item"><span>Direct Conversations</span><span class="content-value">No unread threads &gt;</span></div></div>`,
            "Camera": `<div class="content-group"><div class="content-item"><span>Resolution</span><span class="content-value">50MP Ultra-HD &gt;</span></div><div class="content-item"><span>Video Mode Capture</span><span class="content-value">4K 60FPS &gt;</span></div></div>`,
            "Files": `<div class="content-group"><div class="content-item"><span>Internal Disk</span><span class="content-value">128GB / 512GB Free &gt;</span></div><div class="content-item"><span>Downloads Cache</span><span class="content-value">Cleaned &gt;</span></div></div>`
        };

        function freezeCurrentState() {
            const computedStyle = window.getComputedStyle(globalAppPanel);
            const matrix = computedStyle.transform;
            const currentOpacity = computedStyle.opacity;
            
            globalAppPanel.style.transition = 'none';
            
            if (matrix && matrix !== 'none') {
                globalAppPanel.style.transform = matrix;
            }
            globalAppPanel.style.opacity = currentOpacity;
            void globalAppPanel.offsetHeight; 
        }

        function openApplication(element) {
            globalAppPanel.classList.remove('hidden-content');

            if (isAppWindowTargetOpen && lastOpenedIconElement === element) {
                freezeCurrentState();
                isAppWindowTargetOpen = true;
                
                globalAppPanel.style.opacity = '1'; 
                globalAppPanel.style.transformOrigin = globalAppPanel.dataset.lastOrigin || 'center center';

                requestAnimationFrame(() => {
                    globalAppPanel.style.transition = 'transform 1.2s cubic-bezier(0.15, 1, 0.2, 1)';
                    globalAppPanel.classList.add('open');
                    phoneScreen.classList.add('app-active');
                });
                return;
            }

            freezeCurrentState();

            lastOpenedIconElement = element;
            isAppWindowTargetOpen = true;

            const appName = element.getAttribute('data-app-name');
            globalAppTitle.textContent = appName;
            globalAppContent.innerHTML = appDatabaseContent[appName] || `<div class="content-group"><div class="content-item"><span>Application Status</span><span class="content-value">Default Mode Live &gt;</span></div></div>`;

            const screenRect = phoneScreen.getBoundingClientRect();
            const iconRect = element.getBoundingClientRect();

            const originX = (iconRect.left + iconRect.width / 2) - screenRect.left;
            const originY = (iconRect.top + iconRect.height / 2) - screenRect.top;
            const originStyle = `${originX}px ${originY}px`;
            
            globalAppPanel.style.transformOrigin = originStyle;
            globalAppPanel.dataset.lastOrigin = originStyle;

            const initialScale = iconRect.width / screenRect.width;
            
            globalAppPanel.style.opacity = '1'; 
            globalAppPanel.style.transform = `scale(${initialScale})`;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    globalAppPanel.style.transition = 'transform 1.2s cubic-bezier(0.15, 1, 0.2, 1)';
                    phoneScreen.classList.add('app-active');
                    globalAppPanel.classList.add('open');
                    globalAppPanel.style.transform = 'scale(1)';
                });
            });
        }

        function closeActiveApplication() {
            if (!lastOpenedIconElement) return;
            isAppWindowTargetOpen = false;

            globalAppPanel.classList.add('hidden-content');
            freezeCurrentState();

            const screenRect = phoneScreen.getBoundingClientRect();
            const iconRect = lastOpenedIconElement.getBoundingClientRect();

            const originX = (iconRect.left + iconRect.width / 2) - screenRect.left;
            const originY = (iconRect.top + iconRect.height / 2) - screenRect.top;

            globalAppPanel.style.transformOrigin = `${originX}px ${originY}px`;
            globalAppPanel.classList.remove('open');
            phoneScreen.classList.remove('app-active');

            const targetScale = iconRect.width / screenRect.width;

            requestAnimationFrame(() => {
                globalAppPanel.style.transition = 'transform 1.2s cubic-bezier(0.15, 1, 0.2, 1), opacity 0.5s ease-out 0.2s';
                globalAppPanel.style.transform = `scale(${targetScale})`;
                globalAppPanel.style.opacity = '0';
            });
        }

        let startY = 0;
        let isSwiping = false;

        navBar.addEventListener('pointerdown', (e) => {
            startY = e.clientY;
            isSwiping = true;
            navBar.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        navBar.addEventListener('pointermove', (e) => {
            if (!isSwiping) return;
            let currentY = e.clientY;
            let diffY = startY - currentY;
            if (diffY > 15) { 
                closeActiveApplication();
                isSwiping = false;
                navBar.releasePointerCapture(e.pointerId);
            }
        });

        navBar.addEventListener('pointerup', (e) => {
            isSwiping = false;
            try { navBar.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        navBar.addEventListener('pointercancel', (e) => {
            isSwiping = false;
            try { navBar.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        document.addEventListener('dblclick', (e) => { e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
